name: Verify store and CRM
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mini-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mini-app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser regression on the built storefront
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/gpartner-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          STOREFRONT_QA_URL=http://127.0.0.1:4173 node src/storefront/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-browser-screenshots
          path: apps/mini-app/test-results/storefront
          if-no-files-found: ignore
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag gpartner:test .
      - name: Verify Linux runtime, persistent storage and protected API
        run: python3 scripts/container_smoke.py --image gpartner:test
